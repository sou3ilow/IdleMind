<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<title>Line Guard Duel</title>
<style>
  *, *::before, *::after {
    box-sizing: border-box;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    touch-action: none;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    background: #000;
    touch-action: none;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(() => {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");

  const FIELD_PADDING = 14;
  const TARGET_RADIUS = 11;
  const BALL_RADIUS = 7;
  const MAX_LINES = 3;
  const INITIAL_SPEED = 240;
  const SPEEDUP_ON_HIT = 10;
  const TRAIL_LENGTH = 6;

  const POWER_MARKER_RADIUS = 14;
  const POWER_COOLDOWN = 1.0;
  const POWER_DURATION = 5.0;
  const SPEED_BOOST = 1.55;
  const SIZE_BOOST = 1.65;
  const SPAWN_POWER_SAFE_TIME = 0.8;

  const COLOR_TOP = "#ff2d8b";
  const COLOR_BOTTOM = "#22d3ee";

  let width = 0;
  let height = 0;
  let fieldH = 0;

  let setup = true;
  let running = false;
  let winner = null;

  let top = initialPlayer("top");
  let bottom = initialPlayer("bottom");
  let balls = [];
  let power = null;
  let powerCooldown = 0;

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    width = window.innerWidth;
    height = window.innerHeight;
    fieldH = height / 2;

    canvas.width = Math.floor(width * dpr);
    canvas.height = Math.floor(height * dpr);
    canvas.style.width = width + "px";
    canvas.style.height = height + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function initialPlayer(side) {
    return { side, targets: [], lines: [], pendingPoint: null };
  }

  function clamp(v, a, b) {
    return Math.max(a, Math.min(b, v));
  }

  function dist(a, b) {
    return Math.hypot(a.x - b.x, a.y - b.y);
  }

  function normalize(v) {
    const len = Math.hypot(v.x, v.y) || 1;
    return { x: v.x / len, y: v.y / len };
  }

  function reflectVector(v, n) {
    const d = v.x * n.x + v.y * n.y;
    return { x: v.x - 2 * d * n.x, y: v.y - 2 * d * n.y };
  }

  function segmentCollisionCircle(a, b, c, r) {
    const ab = { x: b.x - a.x, y: b.y - a.y };
    const ac = { x: c.x - a.x, y: c.y - a.y };
    const ab2 = ab.x * ab.x + ab.y * ab.y || 1;
    const t = clamp((ac.x * ab.x + ac.y * ab.y) / ab2, 0, 1);
    const p = { x: a.x + ab.x * t, y: a.y + ab.y * t };
    return dist(p, c) <= r;
  }

  function makeBall(dir) {
    const v = normalize({ x: Math.random() * 0.5 - 0.25, y: dir });
    return {
      id: crypto.randomUUID ? crypto.randomUUID() : String(Math.random()),
      x: width / 2,
      y: height / 2,
      vx: v.x,
      vy: v.y,
      speed: INITIAL_SPEED,
      lastLineHitId: null,
      trail: [],
      age: 0
    };
  }

  function cloneBall(source, angle) {
    const c = Math.cos(angle);
    const s = Math.sin(angle);
    return {
      ...source,
      id: crypto.randomUUID ? crypto.randomUUID() : String(Math.random()),
      vx: source.vx * c - source.vy * s,
      vy: source.vx * s + source.vy * c,
      trail: [],
      lastLineHitId: null
    };
  }

  function resetSetup() {
    top = initialPlayer("top");
    bottom = initialPlayer("bottom");
    balls = [];
    power = null;
    powerCooldown = 0;
    setup = true;
    running = false;
    winner = null;
  }

  function startFrom(lastPlacedSide) {
    const startSide = lastPlacedSide === "top" ? "bottom" : "top";
    const dir = startSide === "top" ? 1 : -1;
    balls = [makeBall(dir)];
    power = null;
    powerCooldown = 0;
    setup = false;
    running = true;
    winner = null;
  }

  function triggerPower(hitBall) {
    if (powerCooldown > 0 || hitBall.age <= SPAWN_POWER_SAFE_TIME) return;

    const kinds = ["speed", "size", "split", "invisible"];
    const kind = kinds[Math.floor(Math.random() * kinds.length)];
    power = { kind, time: POWER_DURATION };
    powerCooldown = POWER_COOLDOWN;

    if (kind === "split") {
      if (balls.length < 2) {
        balls = [hitBall, cloneBall(hitBall, 0.55)].slice(0, 2);
      } else {
        balls = balls.slice(0, 2);
      }
    }
  }

  function step(dt) {
    if (power) {
      power.time -= dt;
      if (power.time <= 0) {
        power = null;
        if (balls.length > 1) balls = [balls[0]];
      }
    }

    powerCooldown = Math.max(0, powerCooldown - dt);

    const marker = { x: width / 2, y: height / 2 };
    const nextBalls = [];

    for (let b of balls) {
      b = {
        ...b,
        age: (b.age || 0) + dt,
        trail: [{ x: b.x, y: b.y }, ...(b.trail || [])].slice(0, TRAIL_LENGTH)
      };

      const radius = power && power.kind === "size" ? BALL_RADIUS * SIZE_BOOST : BALL_RADIUS;
      const speed = b.speed * (power && power.kind === "speed" ? SPEED_BOOST : 1);

      b.x += b.vx * speed * dt;
      b.y += b.vy * speed * dt;

      if (b.x < FIELD_PADDING + radius) {
        b.x = FIELD_PADDING + radius;
        b.vx *= -1;
        b.lastLineHitId = null;
      }
      if (b.x > width - FIELD_PADDING - radius) {
        b.x = width - FIELD_PADDING - radius;
        b.vx *= -1;
        b.lastLineHitId = null;
      }
      if (b.y < FIELD_PADDING + radius) {
        b.y = FIELD_PADDING + radius;
        b.vy *= -1;
        b.lastLineHitId = null;
      }
      if (b.y > height - FIELD_PADDING - radius) {
        b.y = height - FIELD_PADDING - radius;
        b.vy *= -1;
        b.lastLineHitId = null;
      }

      if (dist(b, marker) <= POWER_MARKER_RADIUS + radius) {
        triggerPower(b);
      }

      hitLines(b, top, 0, radius);
      hitLines(b, bottom, fieldH, radius);

      const topHit = hitTargets(b, top, 0, radius, "BLUE WIN");
      const bottomHit = hitTargets(b, bottom, fieldH, radius, "RED WIN");

      if (topHit) {
        nextBalls.push(makeBall(1));
      } else if (bottomHit) {
        nextBalls.push(makeBall(-1));
      } else {
        nextBalls.push(b);
      }
    }

    balls = power && power.kind === "split" ? nextBalls.slice(0, 2) : nextBalls.slice(0, 1);
  }

  function hitLines(ball, player, offsetY, radius) {
    const localBall = { x: ball.x, y: ball.y - offsetY };
    const keep = [];

    for (const line of player.lines) {
      if (!segmentCollisionCircle(line.a, line.b, localBall, radius + 2) || ball.lastLineHitId === line.id) {
        keep.push(line);
        continue;
      }

      const t = normalize({ x: line.b.x - line.a.x, y: line.b.y - line.a.y });
      const n = normalize({ x: -t.y, y: t.x });
      const rv = reflectVector({ x: ball.vx, y: ball.vy }, n);
      ball.vx = rv.x;
      ball.vy = rv.y;
      ball.speed += SPEEDUP_ON_HIT;
      ball.x += ball.vx * 8;
      ball.y += ball.vy * 8;
      ball.lastLineHitId = line.id;
    }

    player.lines = keep;
  }

  function hitTargets(ball, player, offsetY, radius, winLabel) {
    const localBall = { x: ball.x, y: ball.y - offsetY };
    let hit = false;

    for (const t of player.targets) {
      if (!t.alive) continue;
      if (dist(t, localBall) <= TARGET_RADIUS + radius) {
        t.alive = false;
        hit = true;
      }
    }

    if (hit && player.targets.every(t => !t.alive)) {
      winner = winLabel;
      running = false;
    }

    return hit;
  }

  function pointerDown(e) {
    const x = e.clientX;
    const rawY = e.clientY;
    const isTop = rawY < height / 2;
    const y = isTop ? rawY : rawY - height / 2;
    const side = isTop ? "top" : "bottom";
    const player = isTop ? top : bottom;

    if (winner) {
      resetSetup();
      return;
    }

    if (setup) {
      if (player.targets.length >= 3) return;
      if (x < FIELD_PADDING + TARGET_RADIUS || x > width - FIELD_PADDING - TARGET_RADIUS) return;
      if (y < FIELD_PADDING + TARGET_RADIUS || y > fieldH - FIELD_PADDING - TARGET_RADIUS) return;

      player.targets.push({
        id: crypto.randomUUID ? crypto.randomUUID() : String(Math.random()),
        x,
        y,
        alive: true
      });

      if (top.targets.length >= 3 && bottom.targets.length >= 3) {
        startFrom(side);
      }
      return;
    }

    if (!running) return;
    if (x < FIELD_PADDING || x > width - FIELD_PADDING) return;
    if (y < FIELD_PADDING || y > fieldH - FIELD_PADDING) return;

    if (!player.pendingPoint) {
      player.pendingPoint = { x, y };
      return;
    }

    let a = player.pendingPoint;
    let b = { x, y };
    const dx = b.x - a.x;
    const dy = b.y - a.y;
    const d = Math.hypot(dx, dy);
    const maxLen = width * MAX_LINE_RATIO;

    if (d > maxLen) {
      const k = maxLen / d;
      b = { x: a.x + dx * k, y: a.y + dy * k };
    }

    player.lines.push({
      id: crypto.randomUUID ? crypto.randomUUID() : String(Math.random()),
      a,
      b
    });

    if (player.lines.length > MAX_LINES) player.lines.shift();
    player.pendingPoint = null;
  }

  function drawGlowLine(x1, y1, x2, y2, color) {
    ctx.save();
    ctx.lineCap = "round";

    ctx.globalAlpha = 0.18;
    ctx.strokeStyle = color;
    ctx.lineWidth = 20;
    ctx.shadowBlur = 18;
    ctx.shadowColor = color;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();

    ctx.globalAlpha = 0.5;
    ctx.lineWidth = 10;
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();

    ctx.globalAlpha = 1;
    ctx.lineWidth = 5;
    ctx.shadowBlur = 0;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();

    ctx.restore();
  }

  function drawTarget(x, y, alive, color) {
    ctx.save();
    ctx.globalAlpha = alive ? 0.18 : 0.08;
    ctx.fillStyle = alive ? color : "#333";
    ctx.shadowColor = color;
    ctx.shadowBlur = alive ? 18 : 0;
    ctx.beginPath();
    ctx.arc(x, y, TARGET_RADIUS + 8, 0, Math.PI * 2);
    ctx.fill();

    ctx.globalAlpha = 1;
    ctx.strokeStyle = alive ? color : "#333";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(x, y, TARGET_RADIUS + 3, 0, Math.PI * 2);
    ctx.stroke();

    ctx.fillStyle = alive ? color : "#333";
    ctx.beginPath();
    ctx.arc(x, y, TARGET_RADIUS - 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawField(player, offsetY, color) {
    ctx.fillStyle = "#000";
    ctx.fillRect(0, offsetY, width, fieldH);

    if (setup && player.targets.length < 3) {
      ctx.save();
      ctx.fillStyle = color;
      ctx.globalAlpha = 0.85;
      ctx.font = "18px system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.letterSpacing = "4px";
      ctx.fillText("PLACE 3 SPOTS", width / 2, offsetY + fieldH / 2);
      ctx.restore();
    }

    for (const t of player.targets) {
      drawTarget(t.x, t.y + offsetY, t.alive, color);
    }

    if (player.pendingPoint) {
      ctx.save();
      ctx.fillStyle = color;
      ctx.shadowColor = color;
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(player.pendingPoint.x, player.pendingPoint.y + offsetY, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    for (const line of player.lines) {
      drawGlowLine(line.a.x, line.a.y + offsetY, line.b.x, line.b.y + offsetY, color);
    }
  }

  function draw() {
    ctx.clearRect(0, 0, width, height);

    drawField(top, 0, COLOR_TOP);
    drawField(bottom, fieldH, COLOR_BOTTOM);

    ctx.save();
    ctx.strokeStyle = "#fff";
    ctx.globalAlpha = 0.35;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, fieldH);
    ctx.lineTo(width, fieldH);
    ctx.stroke();

    ctx.globalAlpha = 0.55;
    ctx.beginPath();
    ctx.arc(width / 2, height / 2, POWER_MARKER_RADIUS, 0, Math.PI * 2);
    ctx.stroke();

    ctx.globalAlpha = 0.8;
    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.arc(width / 2, height / 2, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    if (!setup) {
      balls.forEach((ball, index) => {
        const radius = power && power.kind === "size" ? BALL_RADIUS * SIZE_BOOST : BALL_RADIUS;
        const visible = !(power && power.kind === "invisible") || Math.sin(performance.now() / 650 + index) > -0.15;

        for (let i = 0; i < ball.trail.length; i++) {
          const p = ball.trail[i];
          ctx.save();
          ctx.globalAlpha = 0.14 * (1 - i / TRAIL_LENGTH);
          ctx.fillStyle = "#fff";
          ctx.beginPath();
          ctx.arc(p.x, p.y, Math.max(1, radius - i * 0.65), 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        if (visible) {
          ctx.save();
          ctx.fillStyle = "#fff";
          ctx.beginPath();
          ctx.arc(ball.x, ball.y, radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      });
    }

    if (winner) {
      ctx.save();
      ctx.fillStyle = winner === "RED WIN" ? COLOR_TOP : COLOR_BOTTOM;
      ctx.font = "900 32px system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.letterSpacing = "6px";
      ctx.shadowColor = ctx.fillStyle;
      ctx.shadowBlur = 14;
      ctx.fillText(winner, width / 2, height / 2);
      ctx.restore();
    }
  }

  let last = performance.now();

  function loop(now) {
    const dt = Math.min(0.03, (now - last) / 1000);
    last = now;
    if (running) step(dt);
    draw();
    requestAnimationFrame(loop);
  }

  window.addEventListener("resize", resize);
  canvas.addEventListener("pointerdown", pointerDown);

  resize();
  resetSetup();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
