<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Line Guard Duel</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    touch-action: none;
    overscroll-behavior: none;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    background: #000;
    touch-action: none;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(() => {
  "use strict";

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");

  const FIELD_PADDING = 14;
  const TARGET_RADIUS = 11;
  const BALL_RADIUS = 7;
  const MAX_LINES = 3;
  const MAX_LINE_RATIO = 0.6;
  const INITIAL_SPEED = 240;
  const SPEEDUP_ON_HIT = 10;
  const TRAIL_LENGTH = 6;

  const POWER_MARKER_RADIUS = 14;
  const POWER_COOLDOWN = 1.0;
  const POWER_DURATION = 5.0;
  const SPEED_BOOST = 1.55;
  const SIZE_BOOST = 1.65;
  const SPAWN_POWER_SAFE_TIME = 0.8;

  const COLOR_RED = "#ff2d8b";
  const COLOR_BLUE = "#22d3ee";

  let W = 1;
  let H = 1;
  let FH = 1;

  let setup = true;
  let running = false;
  let winner = null;

  let red = makePlayer("red");
  let blue = makePlayer("blue");
  let balls = [];
  let power = null;
  let powerCooldown = 0;

  function uid() {
    const c = globalThis.crypto;
    if (c && typeof c.randomUUID === "function") return c.randomUUID();
    return "id-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2);
  }

  function makePlayer(side) {
    return { side, targets: [], lines: [], pending: null };
  }

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    W = Math.max(1, window.innerWidth);
    H = Math.max(1, window.innerHeight);
    FH = H / 2;
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    clampExistingPoints(red);
    clampExistingPoints(blue);
  }

  function clampExistingPoints(player) {
    for (const t of player.targets) {
      t.x = clamp(t.x, FIELD_PADDING + TARGET_RADIUS, W - FIELD_PADDING - TARGET_RADIUS);
      t.y = clamp(t.y, FIELD_PADDING + TARGET_RADIUS, FH - FIELD_PADDING - TARGET_RADIUS);
    }
    if (player.pending) {
      player.pending.x = clamp(player.pending.x, FIELD_PADDING, W - FIELD_PADDING);
      player.pending.y = clamp(player.pending.y, FIELD_PADDING, FH - FIELD_PADDING);
    }
  }

  function clamp(v, min, max) {
    return Math.max(min, Math.min(max, v));
  }

  function distance(a, b) {
    return Math.hypot(a.x - b.x, a.y - b.y);
  }

  function normalize(v) {
    const len = Math.hypot(v.x, v.y) || 1;
    return { x: v.x / len, y: v.y / len };
  }

  function reflect(v, normal) {
    const dot = v.x * normal.x + v.y * normal.y;
    return {
      x: v.x - 2 * dot * normal.x,
      y: v.y - 2 * dot * normal.y
    };
  }

  function segmentHitsCircle(a, b, c, r) {
    const abx = b.x - a.x;
    const aby = b.y - a.y;
    const acx = c.x - a.x;
    const acy = c.y - a.y;
    const ab2 = abx * abx + aby * aby || 1;
    const t = clamp((acx * abx + acy * aby) / ab2, 0, 1);
    const px = a.x + abx * t;
    const py = a.y + aby * t;
    return Math.hypot(c.x - px, c.y - py) <= r;
  }

  function makeBall(dir) {
    const v = normalize({ x: Math.random() * 0.5 - 0.25, y: dir });
    return {
      id: uid(),
      x: W / 2,
      y: H / 2,
      vx: v.x,
      vy: v.y,
      speed: INITIAL_SPEED,
      lastLineHitId: null,
      trail: [],
      age: 0
    };
  }

  function cloneBall(source, angle) {
    const c = Math.cos(angle);
    const s = Math.sin(angle);
    return {
      ...source,
      id: uid(),
      vx: source.vx * c - source.vy * s,
      vy: source.vx * s + source.vy * c,
      trail: [],
      lastLineHitId: null
    };
  }

  function reset() {
    red = makePlayer("red");
    blue = makePlayer("blue");
    balls = [];
    power = null;
    powerCooldown = 0;
    setup = true;
    running = false;
    winner = null;
  }

  function startFromLastPlaced(side) {
    const startSide = side === "red" ? "blue" : "red";
    const dir = startSide === "red" ? 1 : -1;
    balls = [makeBall(dir)];
    power = null;
    powerCooldown = 0;
    setup = false;
    running = true;
    winner = null;
  }

  function triggerPower(hitBall) {
    if (powerCooldown > 0 || hitBall.age <= SPAWN_POWER_SAFE_TIME) return;

    const kinds = ["speed", "size", "split", "invisible"];
    const kind = kinds[Math.floor(Math.random() * kinds.length)];
    power = { kind, time: POWER_DURATION };
    powerCooldown = POWER_COOLDOWN;

    if (kind === "split") {
      if (balls.length < 2) balls = [hitBall, cloneBall(hitBall, 0.55)];
      else balls = balls.slice(0, 2);
    }
  }

  function step(dt) {
    if (power) {
      power.time -= dt;
      if (power.time <= 0) {
        power = null;
        if (balls.length > 1) balls = [balls[0]];
      }
    }
    powerCooldown = Math.max(0, powerCooldown - dt);

    const marker = { x: W / 2, y: H / 2 };
    const nextBalls = [];

    for (let b of balls) {
      b = {
        ...b,
        age: (b.age || 0) + dt,
        trail: [{ x: b.x, y: b.y }, ...(b.trail || [])].slice(0, TRAIL_LENGTH)
      };

      const radius = power && power.kind === "size" ? BALL_RADIUS * SIZE_BOOST : BALL_RADIUS;
      const speed = b.speed * (power && power.kind === "speed" ? SPEED_BOOST : 1);

      b.x += b.vx * speed * dt;
      b.y += b.vy * speed * dt;

      if (b.x < FIELD_PADDING + radius) {
        b.x = FIELD_PADDING + radius;
        b.vx *= -1;
        b.lastLineHitId = null;
      }
      if (b.x > W - FIELD_PADDING - radius) {
        b.x = W - FIELD_PADDING - radius;
        b.vx *= -1;
        b.lastLineHitId = null;
      }
      if (b.y < FIELD_PADDING + radius) {
        b.y = FIELD_PADDING + radius;
        b.vy *= -1;
        b.lastLineHitId = null;
      }
      if (b.y > H - FIELD_PADDING - radius) {
        b.y = H - FIELD_PADDING - radius;
        b.vy *= -1;
        b.lastLineHitId = null;
      }

      if (distance(b, marker) <= POWER_MARKER_RADIUS + radius) {
        triggerPower(b);
      }

      hitLines(b, red, 0, radius);
      hitLines(b, blue, FH, radius);

      const hitRed = hitTargets(b, red, 0, radius, "BLUE WIN");
      const hitBlue = hitTargets(b, blue, FH, radius, "RED WIN");

      if (hitRed) nextBalls.push(makeBall(1));
      else if (hitBlue) nextBalls.push(makeBall(-1));
      else nextBalls.push(b);
    }

    balls = power && power.kind === "split" ? nextBalls.slice(0, 2) : nextBalls.slice(0, 1);
  }

  function hitLines(ball, player, offsetY, radius) {
    const localBall = { x: ball.x, y: ball.y - offsetY };
    const keep = [];

    for (const line of player.lines) {
      if (!segmentHitsCircle(line.a, line.b, localBall, radius + 2) || ball.lastLineHitId === line.id) {
        keep.push(line);
        continue;
      }

      const tangent = normalize({ x: line.b.x - line.a.x, y: line.b.y - line.a.y });
      const normal = normalize({ x: -tangent.y, y: tangent.x });
      const rv = reflect({ x: ball.vx, y: ball.vy }, normal);

      ball.vx = rv.x;
      ball.vy = rv.y;
      ball.speed += SPEEDUP_ON_HIT;
      ball.x += ball.vx * 8;
      ball.y += ball.vy * 8;
      ball.lastLineHitId = line.id;
    }

    player.lines = keep;
  }

  function hitTargets(ball, player, offsetY, radius, winLabel) {
    const localBall = { x: ball.x, y: ball.y - offsetY };
    let hit = false;

    for (const target of player.targets) {
      if (!target.alive) continue;
      if (distance(target, localBall) <= TARGET_RADIUS + radius) {
        target.alive = false;
        hit = true;
      }
    }

    if (hit && player.targets.every(t => !t.alive)) {
      winner = winLabel;
      running = false;
    }

    return hit;
  }

  function pointerDown(e) {
    e.preventDefault();

    const x = e.clientX;
    const rawY = e.clientY;
    const isRed = rawY < H / 2;
    const localY = isRed ? rawY : rawY - H / 2;
    const side = isRed ? "red" : "blue";
    const player = isRed ? red : blue;

    if (winner) {
      reset();
      return;
    }

    if (setup) {
      if (player.targets.length >= 3) return;
      if (x < FIELD_PADDING + TARGET_RADIUS || x > W - FIELD_PADDING - TARGET_RADIUS) return;
      if (localY < FIELD_PADDING + TARGET_RADIUS || localY > FH - FIELD_PADDING - TARGET_RADIUS) return;

      player.targets.push({ id: uid(), x, y: localY, alive: true });

      if (red.targets.length >= 3 && blue.targets.length >= 3) {
        startFromLastPlaced(side);
      }
      return;
    }

    if (!running) return;
    if (x < FIELD_PADDING || x > W - FIELD_PADDING) return;
    if (localY < FIELD_PADDING || localY > FH - FIELD_PADDING) return;

    if (player.pending === null) {
      player.pending = { x, y: localY };
      return;
    }

    const a = player.pending;
    let b = { x, y: localY };
    const dx = b.x - a.x;
    const dy = b.y - a.y;
    const len = Math.hypot(dx, dy);

    if (len > 1) {
      const maxLen = W * MAX_LINE_RATIO;
      if (len > maxLen) {
        const k = maxLen / len;
        b = { x: a.x + dx * k, y: a.y + dy * k };
      }
      player.lines.push({ id: uid(), a, b });
      while (player.lines.length > MAX_LINES) player.lines.shift();
    }

    player.pending = null;
  }

  function drawGlowLine(x1, y1, x2, y2, color) {
    ctx.save();
    ctx.lineCap = "round";
    ctx.strokeStyle = color;
    ctx.shadowColor = color;

    ctx.globalAlpha = 0.18;
    ctx.lineWidth = 22;
    ctx.shadowBlur = 20;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();

    ctx.globalAlpha = 0.5;
    ctx.lineWidth = 11;
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();

    ctx.globalAlpha = 1;
    ctx.lineWidth = 5;
    ctx.shadowBlur = 0;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();

    ctx.restore();
  }

  function drawTarget(x, y, alive, color) {
    ctx.save();

    ctx.globalAlpha = alive ? 0.18 : 0.08;
    ctx.fillStyle = alive ? color : "#333";
    ctx.shadowColor = color;
    ctx.shadowBlur = alive ? 18 : 0;
    ctx.beginPath();
    ctx.arc(x, y, TARGET_RADIUS + 8, 0, Math.PI * 2);
    ctx.fill();

    ctx.globalAlpha = 1;
    ctx.strokeStyle = alive ? color : "#333";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(x, y, TARGET_RADIUS + 3, 0, Math.PI * 2);
    ctx.stroke();

    ctx.fillStyle = alive ? color : "#333";
    ctx.beginPath();
    ctx.arc(x, y, TARGET_RADIUS - 4, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function drawField(player, offsetY, color) {
    ctx.fillStyle = "#000";
    ctx.fillRect(0, offsetY, W, FH);

    if (setup && player.targets.length < 3) {
      ctx.save();
      ctx.fillStyle = color;
      ctx.globalAlpha = 0.85;
      ctx.font = "18px system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("PLACE 3 SPOTS", W / 2, offsetY + FH / 2);
      ctx.restore();
    }

    for (const target of player.targets) drawTarget(target.x, target.y + offsetY, target.alive, color);

    if (player.pending) {
      ctx.save();
      ctx.fillStyle = color;
      ctx.shadowColor = color;
      ctx.shadowBlur = 14;
      ctx.beginPath();
      ctx.arc(player.pending.x, player.pending.y + offsetY, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    for (const line of player.lines) drawGlowLine(line.a.x, line.a.y + offsetY, line.b.x, line.b.y + offsetY, color);
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    drawField(red, 0, COLOR_RED);
    drawField(blue, FH, COLOR_BLUE);

    ctx.save();
    ctx.strokeStyle = "#fff";
    ctx.globalAlpha = 0.35;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, FH);
    ctx.lineTo(W, FH);
    ctx.stroke();

    ctx.globalAlpha = 0.55;
    ctx.beginPath();
    ctx.arc(W / 2, H / 2, POWER_MARKER_RADIUS, 0, Math.PI * 2);
    ctx.stroke();

    ctx.globalAlpha = 0.8;
    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.arc(W / 2, H / 2, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    if (!setup) {
      for (let index = 0; index < balls.length; index++) {
        const ball = balls[index];
        const radius = power && power.kind === "size" ? BALL_RADIUS * SIZE_BOOST : BALL_RADIUS;
        const visible = !(power && power.kind === "invisible") || Math.sin(performance.now() / 650 + index) > -0.15;

        for (let i = 0; i < ball.trail.length; i++) {
          const p = ball.trail[i];
          ctx.save();
          ctx.globalAlpha = 0.14 * (1 - i / TRAIL_LENGTH);
          ctx.fillStyle = "#fff";
          ctx.beginPath();
          ctx.arc(p.x, p.y, Math.max(1, radius - i * 0.65), 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        if (visible) {
          ctx.save();
          ctx.fillStyle = "#fff";
          ctx.beginPath();
          ctx.arc(ball.x, ball.y, radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }
    }

    if (winner) {
      ctx.save();
      ctx.fillStyle = winner === "RED WIN" ? COLOR_RED : COLOR_BLUE;
      ctx.font = "900 32px system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.shadowColor = ctx.fillStyle;
      ctx.shadowBlur = 14;
      ctx.fillText(winner, W / 2, H / 2);
      ctx.restore();
    }
  }

  let last = performance.now();

  function loop(now) {
    const dt = Math.min(0.03, (now - last) / 1000);
    last = now;
    if (running) step(dt);
    draw();
    requestAnimationFrame(loop);
  }

  window.addEventListener("resize", resize, { passive: true });
  canvas.addEventListener("pointerdown", pointerDown, { passive: false });

  resize();
  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
