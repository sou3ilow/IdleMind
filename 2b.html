<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Line Guard Duel</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    touch-action: none;
    overscroll-behavior: none;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    background: #000;
    touch-action: none;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(() => {
  "use strict";

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");

  const FIELD_PADDING = 14;
  const TARGET_RADIUS = 11;
  const BASE_BALL_RADIUS = 7;
  const MAX_LINES = 3;
  const MAX_LINE_RATIO = 0.6;
  const INITIAL_SPEED = 240;
  const SPEEDUP_ON_HIT = 10;
  const TRAIL_LENGTH = 6;

  const CENTER_RADIUS = 16;
  const CENTER_COOLDOWN = 0.9;
  const SPAWN_SAFE_TIME = 0.8;

  const COLOR_RED = "#ff2d8b";
  const COLOR_BLUE = "#22d3ee";

  const TYPES = ["normal", "speed", "big", "small", "split"];
  const TYPE_COLOR = {
    normal: "#ffffff",
    speed: "#ffe066",
    big: "#ff7a18",
    small: "#a78bfa",
    split: "#7cff6b"
  };

  function ballVisuals(type) {
    const tint = TYPE_COLOR[type] || "#ffffff";
    if (type === "normal") {
      return { fill: "#ffffff", stroke: "#ffffff", trail: "#ffffff", shadowBlur: 8 };
    }
    return { fill: "#ffffff", stroke: tint, trail: tint, shadowBlur: 14 };
  }

  let W = 1;
  let H = 1;
  let FH = 1;

  let setup = true;
  let running = false;
  let winner = null;
  let pendingWin = null;

  let red = makePlayer("red");
  let blue = makePlayer("blue");

  let balls = [];
  let particles = [];
  let currentType = "normal";
  let nextType = "speed";
  let centerCooldown = 0;

  function uid() {
    const c = globalThis.crypto;
    if (c && typeof c.randomUUID === "function") return c.randomUUID();
    return "id-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2);
  }

  function makePlayer(side) {
    return { side, targets: [], lines: [], pending: null };
  }

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    W = Math.max(1, window.innerWidth);
    H = Math.max(1, window.innerHeight);
    FH = H / 2;
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    clampExistingPoints(red);
    clampExistingPoints(blue);
  }

  function clampExistingPoints(player) {
    for (const t of player.targets) {
      t.x = clamp(t.x, FIELD_PADDING + TARGET_RADIUS, W - FIELD_PADDING - TARGET_RADIUS);
      t.y = clamp(t.y, FIELD_PADDING + TARGET_RADIUS, FH - FIELD_PADDING - TARGET_RADIUS);
    }
    if (player.pending) {
      player.pending.x = clamp(player.pending.x, FIELD_PADDING, W - FIELD_PADDING);
      player.pending.y = clamp(player.pending.y, FIELD_PADDING, FH - FIELD_PADDING);
    }
  }

  function clamp(v, min, max) {
    return Math.max(min, Math.min(max, v));
  }

  function distance(a, b) {
    return Math.hypot(a.x - b.x, a.y - b.y);
  }

  function normalize(v) {
    const len = Math.hypot(v.x, v.y) || 1;
    return { x: v.x / len, y: v.y / len };
  }

  function reflect(v, normal) {
    const dot = v.x * normal.x + v.y * normal.y;
    return {
      x: v.x - 2 * dot * normal.x,
      y: v.y - 2 * dot * normal.y
    };
  }

  function segmentHitsCircle(a, b, c, r) {
    const abx = b.x - a.x;
    const aby = b.y - a.y;
    const acx = c.x - a.x;
    const acy = c.y - a.y;
    const ab2 = abx * abx + aby * aby || 1;
    const t = clamp((acx * abx + acy * aby) / ab2, 0, 1);
    const px = a.x + abx * t;
    const py = a.y + aby * t;
    return Math.hypot(c.x - px, c.y - py) <= r;
  }

  function typeRadius(type) {
    if (type === "big") return BASE_BALL_RADIUS * 2.25;
    if (type === "small") return BASE_BALL_RADIUS * 0.62;
    return BASE_BALL_RADIUS;
  }

  function typeSpeed(type, baseSpeed) {
    if (type === "speed") return baseSpeed * 1.55;
    if (type === "small") return baseSpeed * 1.18;
    if (type === "big") return baseSpeed * 0.9;
    return baseSpeed;
  }

  function pickNextType(exceptType) {
    const pool = TYPES.filter(t => t !== exceptType);
    return pool[Math.floor(Math.random() * pool.length)];
  }

  function makeBall(dir, type = currentType, x = W / 2, y = H / 2) {
    const v = normalize({ x: Math.random() * 0.5 - 0.25, y: dir });
    return {
      id: uid(),
      groupId: uid(),
      type,
      bigBreaksLeft: type === "big" ? 1 : 0,
      x,
      y,
      vx: v.x,
      vy: v.y,
      speed: INITIAL_SPEED,
      lastLineHitId: null,
      trail: [],
      age: 0
    };
  }

  function cloneSplitBall(source, angle) {
    const c = Math.cos(angle);
    const s = Math.sin(angle);
    return {
      ...source,
      id: uid(),
      vx: source.vx * c - source.vy * s,
      vy: source.vx * s + source.vy * c,
      trail: [],
      lastLineHitId: null
    };
  }

  function applyBallType(ball, type) {
    currentType = type;
    nextType = pickNextType(type);
    centerCooldown = CENTER_COOLDOWN;

    if (type === "split") {
      const a = { ...ball, type, groupId: uid(), trail: [], lastLineHitId: null };
      const b = cloneSplitBall(a, 0.55);
      balls = [a, b].slice(0, 2);
      return;
    }

    balls = [{
      ...ball,
      id: uid(),
      groupId: uid(),
      type,
      bigBreaksLeft: type === "big" ? 1 : 0,
      trail: [],
      lastLineHitId: null
    }];
  }

  function reset() {
    red = makePlayer("red");
    blue = makePlayer("blue");
    balls = [];
    currentType = "normal";
    nextType = pickNextType(currentType);
    centerCooldown = 0;
    setup = true;
    running = false;
    winner = null;
    pendingWin = null;
  }

  function startFromLastPlaced(side) {
    const startSide = side === "red" ? "blue" : "red";
    const dir = startSide === "red" ? 1 : -1;
    currentType = "normal";
    nextType = pickNextType(currentType);
    centerCooldown = CENTER_COOLDOWN;
    balls = [makeBall(dir, currentType)];
    setup = false;
    running = true;
    winner = null;
    pendingWin = null;
  }

  
  function updateParticles(dt) {
    particles = particles.filter(p => p.life > 0);
    for (const p of particles) {
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= 0.96;
      p.vy *= 0.96;
      p.life -= dt;
    }

    if (pendingWin && particles.length === 0) {
      winner = pendingWin;
      pendingWin = null;
    }
  }

function step(dt) {
    centerCooldown = Math.max(0, centerCooldown - dt);
    const marker = { x: W / 2, y: H / 2 };
    const nextBalls = [];

    for (let b of balls) {
      b = {
        ...b,
        age: (b.age || 0) + dt,
        trail: [{ x: b.x, y: b.y }, ...(b.trail || [])].slice(0, TRAIL_LENGTH)
      };

      const radius = typeRadius(b.type);
      const speed = typeSpeed(b.type, b.speed);

      b.x += b.vx * speed * dt;
      b.y += b.vy * speed * dt;

      if (b.x < FIELD_PADDING + radius) {
        b.x = FIELD_PADDING + radius;
        b.vx *= -1;
        b.lastLineHitId = null;
      }
      if (b.x > W - FIELD_PADDING - radius) {
        b.x = W - FIELD_PADDING - radius;
        b.vx *= -1;
        b.lastLineHitId = null;
      }
      if (b.y < FIELD_PADDING + radius) {
        b.y = FIELD_PADDING + radius;
        b.vy *= -1;
        b.lastLineHitId = null;
      }
      if (b.y > H - FIELD_PADDING - radius) {
        b.y = H - FIELD_PADDING - radius;
        b.vy *= -1;
        b.lastLineHitId = null;
      }

      if (b.age > SPAWN_SAFE_TIME && centerCooldown <= 0 && distance(b, marker) <= CENTER_RADIUS + radius) {
        applyBallType(b, nextType);
        return;
      }

      const beforeRed = red.lines.length;
      const beforeBlue = blue.lines.length;

      hitLines(b, red, 0, radius);
      hitLines(b, blue, FH, radius);

      const hitRed = hitTargets(b, red, 0, radius, "BLUE WIN");
      const hitBlue = hitTargets(b, blue, FH, radius, "RED WIN");

      if (pendingWin) {
        // Wait for particles, then show WIN.
      } else if (hitRed) nextBalls.push(makeBall(1, currentType));
      else if (hitBlue) nextBalls.push(makeBall(-1, currentType));
      else nextBalls.push(b);
    }

    balls = currentType === "split" ? nextBalls.slice(0, 2) : nextBalls.slice(0, 1);

    if (balls.length === 0 && running && !winner) {
      balls = [makeBall(Math.random() < 0.5 ? -1 : 1, currentType)];
    }
  }

  
  function spawnParticles(x, y, color, count=18){
    for(let i=0;i<count;i++){
      const a = Math.random()*Math.PI*2;
      const s = Math.random()*120+40;
      particles.push({
        x,y,
        vx: Math.cos(a)*s,
        vy: Math.sin(a)*s,
        life: 0.6,
        color
      });
    }
  }

  function hitLines(ball, player, offsetY, radius) {
    const localBall = { x: ball.x, y: ball.y - offsetY };
    const keep = [];

    for (const line of player.lines) {
      const hit = segmentHitsCircle(line.a, line.b, localBall, radius + 2);

      if (!hit || ball.lastLineHitId === line.id) {
        keep.push(line);
        continue;
      }

      if (ball.type === "big" && ball.bigBreaksLeft > 0) {
        spawnParticles(localBall.x, localBall.y + offsetY, player.side === "red" ? COLOR_RED : COLOR_BLUE);
        ball.bigBreaksLeft -= 1;
        ball.type = "normal";
        currentType = "normal";
        continue;
      }

      const tangent = normalize({ x: line.b.x - line.a.x, y: line.b.y - line.a.y });
      const normal = normalize({ x: -tangent.y, y: tangent.x });
      const rv = reflect({ x: ball.vx, y: ball.vy }, normal);

      ball.vx = rv.x;
      ball.vy = rv.y;
      ball.speed += SPEEDUP_ON_HIT;
      ball.x += ball.vx * 8;
      ball.y += ball.vy * 8;
      ball.lastLineHitId = line.id;

      // Normal bars disappear after one bounce.
      spawnParticles(localBall.x, localBall.y + offsetY, player.side === "red" ? COLOR_RED : COLOR_BLUE);
    }

    player.lines = keep;
  }

  function hitTargets(ball, player, offsetY, radius, winLabel) {
    const localBall = { x: ball.x, y: ball.y - offsetY };
    let hit = false;

    for (const target of player.targets) {
      if (!target.alive) continue;
      if (distance(target, localBall) <= TARGET_RADIUS + radius) {
        target.alive = false;
        spawnParticles(target.x, target.y+offsetY, player.side==="red"?COLOR_RED:COLOR_BLUE, 28);
        hit = true;
      }
    }

    if (hit && player.targets.every(t => !t.alive)) {
      pendingWin = winLabel;
      running = false;
    }

    return hit;
  }

  function pointerDown(e) {
    e.preventDefault();

    const x = e.clientX;
    const rawY = e.clientY;
    const isRed = rawY < H / 2;
    const localY = isRed ? rawY : rawY - H / 2;
    const side = isRed ? "red" : "blue";
    const player = isRed ? red : blue;

    if (winner) {
      reset();
      return;
    }

    if (setup) {
      if (player.targets.length >= 3) return;
      if (x < FIELD_PADDING + TARGET_RADIUS || x > W - FIELD_PADDING - TARGET_RADIUS) return;
      if (localY < FIELD_PADDING + TARGET_RADIUS || localY > FH - FIELD_PADDING - TARGET_RADIUS) return;

      player.targets.push({
        id: uid(),
        x,
        y: localY,
        alive: true
      });

      if (red.targets.length >= 3 && blue.targets.length >= 3) {
        startFromLastPlaced(side);
      }
      return;
    }

    if (!running) return;
    if (x < FIELD_PADDING || x > W - FIELD_PADDING) return;
    if (localY < FIELD_PADDING || localY > FH - FIELD_PADDING) return;

    if (player.pending === null) {
      player.pending = { x, y: localY };
      return;
    }

    const a = player.pending;
    let b = { x, y: localY };
    const dx = b.x - a.x;
    const dy = b.y - a.y;
    const len = Math.hypot(dx, dy);

    if (len > 1) {
      const maxLen = W * MAX_LINE_RATIO;
      if (len > maxLen) {
        const k = maxLen / len;
        b = { x: a.x + dx * k, y: a.y + dy * k };
      }

      player.lines.push({ id: uid(), a, b });
      while (player.lines.length > MAX_LINES) player.lines.shift();
    }

    player.pending = null;
  }

  function drawGlowLine(x1, y1, x2, y2, color) {
    ctx.save();
    ctx.lineCap = "round";
    ctx.strokeStyle = color;
    ctx.shadowColor = color;

    ctx.globalAlpha = 0.18;
    ctx.lineWidth = 12;
    ctx.shadowBlur = 20;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();

    ctx.globalAlpha = 0.5;
    ctx.lineWidth = 6;
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();

    ctx.globalAlpha = 1;
    ctx.lineWidth = 3;
    ctx.shadowBlur = 0;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();

    ctx.restore();
  }

  function drawTarget(x, y, alive, color) {
    ctx.save();

    ctx.globalAlpha = alive ? 0.18 : 0.08;
    ctx.fillStyle = alive ? color : "#333";
    ctx.shadowColor = color;
    ctx.shadowBlur = alive ? 18 : 0;
    ctx.beginPath();
    ctx.arc(x, y, TARGET_RADIUS + 8, 0, Math.PI * 2);
    ctx.fill();

    ctx.globalAlpha = 1;
    ctx.strokeStyle = alive ? color : "#333";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(x, y, TARGET_RADIUS + 3, 0, Math.PI * 2);
    ctx.stroke();

    ctx.fillStyle = alive ? color : "#333";
    ctx.beginPath();
    ctx.arc(x, y, TARGET_RADIUS - 4, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function drawField(player, offsetY, color) {
    ctx.fillStyle = "#000";
    ctx.fillRect(0, offsetY, W, FH);

    if (setup && player.targets.length < 3) {
      ctx.save();
      ctx.fillStyle = color;
      ctx.globalAlpha = 0.85;
      ctx.font = "18px system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("PLACE 3 SPOTS", W / 2, offsetY + FH / 2);
      ctx.restore();
    }

    for (const target of player.targets) {
      drawTarget(target.x, target.y + offsetY, target.alive, color);
    }

    if (player.pending) {
      ctx.save();
      ctx.fillStyle = color;
      ctx.shadowColor = color;
      ctx.shadowBlur = 14;
      ctx.beginPath();
      ctx.arc(player.pending.x, player.pending.y + offsetY, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    for (const line of player.lines) {
      drawGlowLine(line.a.x, line.a.y + offsetY, line.b.x, line.b.y + offsetY, color);
    }
  }

  function drawCenter(now) {
    const color = TYPE_COLOR[nextType] || "#fff";
    const cx = W / 2;
    const cy = H / 2;

    ctx.save();

    ctx.strokeStyle = "#fff";
    ctx.globalAlpha = 0.35;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, FH);
    ctx.lineTo(W, FH);
    ctx.stroke();

    const cycle = 2000;
    const dashPart = 0.34;
    const t = (now % cycle) / cycle;
    const dashStart = 1 - dashPart;
    const charge = Math.min(t / dashStart, 1);
    const dashT = t < dashStart ? 0 : (t - dashStart) / dashPart;

    const easeDash = dashT < 0.5
      ? 4 * dashT * dashT * dashT
      : 1 - Math.pow(-2 * dashT + 2, 3) / 2;

    // Continuous phase: slow during charge, fast during dash. No jump between cycles.
    const cycleIndex = Math.floor(now / cycle);
    const slowTurnsPerCycle = 0.51;
    const fastTurns = 0.82;
    const phaseInCycle = t < dashStart
      ? (charge * slowTurnsPerCycle)
      : (slowTurnsPerCycle + easeDash * fastTurns);
    const angle = (cycleIndex * (slowTurnsPerCycle + fastTurns) + phaseInCycle) * Math.PI * 2;

    const chargeGlow = Math.pow(charge, 2.4);
    const dashGlow = t < dashStart ? 0 : Math.max(0, 1 - dashT) * 0.55;
    const headGlow = 0.45 + chargeGlow * 0.85 + dashGlow;

    ctx.translate(cx, cy);
    ctx.rotate(angle);

    const r = CENTER_RADIUS + 1;
    const tailLen = Math.PI * 2.0;

    ctx.strokeStyle = color;
    ctx.globalAlpha = 0.06;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.stroke();

    const segments = 44;
    for (let i = 0; i < segments; i++) {
      const p0 = i / segments;
      const p1 = (i + 1) / segments;
      const a0 = -tailLen * p1;
      const a1 = -tailLen * p0;

      // Long comet trail: keep rear visible, but still brightest near the head.
      const decay = 0.18 + 0.82 * Math.pow(1 - p0, 1.15);

      ctx.strokeStyle = i > segments - 5 ? "#ffffff" : color;
      ctx.shadowColor = i > segments - 5 ? "#ffffff" : color;
      ctx.shadowBlur = 6 + 10 * decay;
      ctx.globalAlpha = clamp(decay * 0.34, 0, 0.72);
      ctx.lineWidth = 1.4 + decay * 1.7;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.arc(0, 0, r, a0, a1);
      ctx.stroke();
    }

    const hx = r;
    const hy = 0;

    // Swell at the end of charge, then return to base size during dash.
    const chargePulse = Math.pow(charge, 4.0);
    const dashReset = t < dashStart ? 1 : (1 - dashT);
    const pulse = 1 + chargePulse * 0.38 * dashReset;

    // Filled disk, restrained size.
    const diskRadius = 2.6 * pulse;
    const diskGrad = ctx.createRadialGradient(hx, hy, 0, hx, hy, diskRadius * 1.65);
    diskGrad.addColorStop(0.0, "#ffffff");
    diskGrad.addColorStop(0.52, "#ffffff");
    diskGrad.addColorStop(0.76, color);
    diskGrad.addColorStop(1.0, "rgba(255,255,255,0)");

    ctx.fillStyle = diskGrad;
    ctx.shadowColor = "#ffffff";
    ctx.shadowBlur = 10 + 18 * headGlow;
    ctx.globalAlpha = clamp(0.64 + headGlow * 0.30, 0, 1);
    ctx.beginPath();
    ctx.arc(hx, hy, diskRadius * 1.65, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#ffffff";
    ctx.shadowColor = color;
    ctx.shadowBlur = 14 + 20 * headGlow;
    ctx.globalAlpha = clamp(0.74 + chargeGlow * 0.18 * dashReset, 0, 1);
    ctx.beginPath();
    ctx.arc(hx, hy, diskRadius, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function drawBall(ball, index, now) {
    const radius = typeRadius(ball.type);
    const visuals = ballVisuals(ball.type);

    for (let i = 0; i < ball.trail.length; i++) {
      const p = ball.trail[i];
      ctx.save();
      ctx.globalAlpha = 0.14 * (1 - i / TRAIL_LENGTH);
      ctx.fillStyle = visuals.trail;
      ctx.beginPath();
      ctx.arc(p.x, p.y, Math.max(1, radius - i * 0.65), 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    ctx.save();
    ctx.fillStyle = visuals.fill;
    ctx.globalAlpha = ball.type === "small" ? 0.92 : 1;
    ctx.shadowColor = visuals.stroke;
    ctx.shadowBlur = visuals.shadowBlur;
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, radius, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = visuals.stroke;
    ctx.lineWidth = ball.type === "small" ? 1.6 : 2;
    ctx.globalAlpha = 0.95;
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, Math.max(1, radius - 1), 0, Math.PI * 2);
    ctx.stroke();

    ctx.restore();
  }

  function draw(now) {
    ctx.clearRect(0, 0, W, H);

    drawField(red, 0, COLOR_RED);
    drawField(blue, FH, COLOR_BLUE);
    drawCenter(now);

    
    // particles
    for(const p of particles){
      ctx.save();
      ctx.globalAlpha = Math.max(0,p.life*1.6);
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 2.2, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
    }

    if (!setup) {
      for (let i = 0; i < balls.length; i++) {
        drawBall(balls[i], i, now);
      }
    }

    if (winner) {
      ctx.save();
      ctx.fillStyle = winner === "RED WIN" ? COLOR_RED : COLOR_BLUE;
      ctx.font = "900 32px system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.shadowColor = ctx.fillStyle;
      ctx.shadowBlur = 14;
      ctx.fillText(winner, W / 2, H / 2);
      ctx.restore();
    }
  }

  let last = performance.now();

  function loop(now) {
    const dt = Math.min(0.03, (now - last) / 1000);
    last = now;
    updateParticles(dt);
    if (running) step(dt);
    draw(now);
    requestAnimationFrame(loop);
  }

  window.addEventListener("resize", resize, { passive: true });
  canvas.addEventListener("pointerdown", pointerDown, { passive: false });

  resize();
  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
